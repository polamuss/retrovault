name: Construire RetroVault
on:
  workflow_call:
    inputs:
      long_scan:
        type: boolean
        default: false
      lookup:
        type: boolean
        default: false
      refresh_sources:
        type: boolean
        default: false
      publish:
        type: boolean
        default: false
      stage:
        type: string
        required: true
      previous_stage:
        type: string
        default: ''
    secrets:
      STEAMGRIDDB_API_KEY:
        required: false
      IGDB_CLIENT_ID:
        required: false
      IGDB_CLIENT_SECRET:
        required: false
    outputs:
      continue_scan:
        value: ${{ jobs.build.outputs.continue_scan }}
      cache_key:
        value: ${{ jobs.build.outputs.cache_key }}
jobs:
  build:
    permissions:
      contents: read
      pages: read
    runs-on: ubuntu-latest
    timeout-minutes: 285
    outputs:
      continue_scan: ${{ steps.lookup.outputs.continue_scan }}
      cache_key: ${{ steps.cache_key.outputs.key }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install Pillow==11.3.0
      - name: Calculer la cle du cache
        id: cache_key
        run: echo "key=retrovault-media-v1-${{ github.run_id }}-${{ github.run_attempt }}-${{ inputs.stage }}" >> "$GITHUB_OUTPUT"
      - name: Restaurer les images deja telechargees
        uses: actions/cache/restore@v4
        with:
          path: .rv-image-cache
          key: ${{ inputs.previous_stage || steps.cache_key.outputs.key }}
          restore-keys: ${{ inputs.previous_stage == '' && 'retrovault-media-v1-' || '' }}
          fail-on-cache-miss: ${{ inputs.previous_stage != '' }}
      - run: python -m py_compile tools/build.py tools/art_index.py tools/launchbox_index.py tools/fixed_photos.py tools/gametdb_index.py tools/openvgdb_index.py tools/steamgriddb_index.py tools/check_public_secrets.py
      - name: Tester les correspondances SteamGridDB hors ligne
        run: python tools/test_steamgriddb_index.py
      - run: python tools/build.py --fetch --output dist
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RV_REFRESH_SOURCES: ${{ inputs.refresh_sources && '1' || '0' }}
      - name: Indexer les references SteamGridDB
        id: lookup
        run: |
          if [ "$RV_LONG_SCAN" = "true" ]; then
            python tools/steamgriddb_index.py dist --long-scan
          else
            python tools/steamgriddb_index.py dist
          fi
        env:
          RV_LONG_SCAN: ${{ inputs.long_scan }}
          STEAMGRIDDB_API_KEY: ${{ inputs.lookup && secrets.STEAMGRIDDB_API_KEY || '' }}
      - name: Sauvegarder la progression des recherches
        if: ${{ always() && !cancelled() }}
        uses: actions/cache/save@v4
        with:
          path: .rv-image-cache
          key: ${{ steps.cache_key.outputs.key }}
      - name: Verifier l absence de secrets dans le site public
        run: python tools/check_public_secrets.py dist
        env:
          RV_CHECK_IGDB_ID: ${{ secrets.IGDB_CLIENT_ID }}
          RV_CHECK_IGDB_SECRET: ${{ secrets.IGDB_CLIENT_SECRET }}
          RV_CHECK_STEAMGRIDDB: ${{ secrets.STEAMGRIDDB_API_KEY }}
      - uses: actions/upload-pages-artifact@v3
        if: ${{ inputs.publish }}
        with:
          path: dist
