name: Publier RetroVault
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    permissions:
      contents: read
      pages: read
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install Pillow==11.3.0
      - name: Restaurer les images deja telechargees
        uses: actions/cache@v4
        with:
          path: .rv-image-cache
          key: retrovault-media-v1-${{ github.run_id }}
          restore-keys: retrovault-media-v1-
      - run: python -m py_compile tools/build.py tools/art_index.py tools/launchbox_index.py tools/fixed_photos.py tools/gametdb_index.py tools/openvgdb_index.py
      - run: python tools/build.py --fetch --output dist
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Verifier l absence de secrets dans le site public
        run: python tools/check_public_secrets.py dist
        env:
          RV_CHECK_IGDB_ID: ${{ secrets.IGDB_CLIENT_ID }}
          RV_CHECK_IGDB_SECRET: ${{ secrets.IGDB_CLIENT_SECRET }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    permissions:
      contents: read
      pages: write
      id-token: write
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
