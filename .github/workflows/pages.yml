name: Publier RetroVault
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      steamgriddb:
        description: Rechercher des images SteamGridDB sur 300 titres maximum (conditions API acceptées)
        type: boolean
        default: false
      steamgriddb_long:
        description: Recherche longue SteamGridDB (12 heures maximum en 3 phases, reprise du cache, conditions API acceptées)
        type: boolean
        default: false
      refresh_sources:
        description: Actualiser les index LaunchBox, Libretro et GameTDB avant la recherche
        type: boolean
        default: true
permissions:
  contents: read
  pages: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    uses: ./.github/workflows/build-catalog.yml
    with:
      stage: first
      lookup: ${{ github.event_name == 'workflow_dispatch' && (inputs.steamgriddb || inputs.steamgriddb_long) }}
      long_scan: ${{ github.event_name == 'workflow_dispatch' && inputs.steamgriddb_long }}
      refresh_sources: ${{ github.event_name == 'workflow_dispatch' && inputs.refresh_sources }}
      publish: ${{ !(github.event_name == 'workflow_dispatch' && inputs.steamgriddb_long) }}
    secrets: inherit
  scan2:
    needs: build
    if: ${{ inputs.steamgriddb_long && needs.build.outputs.continue_scan == 'true' }}
    uses: ./.github/workflows/build-catalog.yml
    with:
      stage: second
      previous_stage: ${{ needs.build.outputs.cache_key }}
      lookup: true
      long_scan: true
    secrets: inherit
  scan3:
    needs: scan2
    if: ${{ needs.scan2.outputs.continue_scan == 'true' }}
    uses: ./.github/workflows/build-catalog.yml
    with:
      stage: third
      previous_stage: ${{ needs.scan2.outputs.cache_key }}
      lookup: true
      long_scan: true
    secrets: inherit
  publish:
    needs: [build, scan2, scan3]
    if: ${{ always() && !cancelled() && inputs.steamgriddb_long && needs.build.result == 'success' && (needs.scan2.result == 'success' || needs.scan2.result == 'skipped') && (needs.scan3.result == 'success' || needs.scan3.result == 'skipped') }}
    uses: ./.github/workflows/build-catalog.yml
    with:
      stage: final
      previous_stage: ${{ needs.scan3.outputs.cache_key || needs.scan2.outputs.cache_key || needs.build.outputs.cache_key }}
      publish: true
    secrets: inherit
  deploy:
    permissions:
      contents: read
      pages: write
      id-token: write
    needs: [build, scan2, scan3, publish]
    if: ${{ always() && !cancelled() && needs.build.result == 'success' && (needs.publish.result == 'success' || (!inputs.steamgriddb_long && needs.publish.result == 'skipped')) }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
