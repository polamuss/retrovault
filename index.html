async function fixedStore(mode,name,value){try{let database=await new Promise((resolve,reject)=>{let r=indexedDB.open('RetroVaultFixedPhotos',1);r.onupgradeneeded=()=>r.result.createObjectStore('photos');r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)});try{return await new Promise((resolve,reject)=>{let t=database.transaction('photos',mode==='load'?'readonly':'readwrite'),st=t.objectStore('photos'),result;if(mode==='load'){result=Object.create(null);let r=st.openCursor();r.onsuccess=()=>{let c=r.result;if(c){if(typeof c.key==='string'&&safePicture(c.value)&&c.value.startsWith('data:image/'))result[c.key]=c.value;c.continue()}}}else if(mode==='put')st.put(value,name);else st.delete(name);t.oncomplete=()=>resolve(result);t.onerror=t.onabort=()=>reject(t.error)})}finally{database.close()}}catch{let k='retrovault-fixed-photos';let raw=JSON.parse(localStorage.getItem(k)||'{}'),map=Object.assign(Object.create(null),raw);if(mode==='load')return map;if(mode==='put')map[name]=value;else delete map[name];localStorage.setItem(k,JSON.stringify(map))}}

async function rvPreparePublicPhoto(photo){
 if(typeof photo!=='string'||!/^data:image\/(?:jpeg|png|webp);base64,/i.test(photo))throw Error('Format de photo incorrect')
 const im=new Image()
 im.src=photo
 await im.decode()
 if(!im.naturalWidth||!im.naturalHeight||im.naturalWidth*im.naturalHeight>40000000)throw Error('Dimensions incorrectes')
 const scale=Math.min(1,480/Math.max(im.naturalWidth,im.naturalHeight))
 const c=document.createElement('canvas')
 c.width=Math.max(1,Math.round(im.naturalWidth*scale))
 c.height=Math.max(1,Math.round(im.naturalHeight*scale))
 c.getContext('2d').drawImage(im,0,0,c.width,c.height)
 let value=c.toDataURL('image/webp',.84)
 if(value.length>700000)value=c.toDataURL('image/webp',.65)
 if(value.length>700000)value=c.toDataURL('image/jpeg',.72)
 if(value.length>700000||!/^data:image\/(?:jpeg|png|webp);base64,/.test(value))throw Error('Photo impossible à réduire')
 return value
}
async function exportFixedPhoto(){
 const p=findPlatform(browsePlatform),photo=p&&userFixedPhotos[p.name]
 if(!p||!photo)return
 if(!confirm('Cette photo sera publique sur GitHub après validation. Confirme que tu as créé cette photo ou disposes du droit de la redistribuer. Ne publie pas de photo privée.'))return
 const credit=prompt('Auteur et source de la photo (obligatoire). Exemple : photo personnelle.','')
 if(!credit?.trim())return
 try{
  const bytes=new TextEncoder().encode(p.name)
  const digest=Array.from(new Uint8Array(await crypto.subtle.digest('SHA-256',bytes)),b=>b.toString(16).padStart(2,'0')).join('').slice(0,32)
  const file=digest+'.json'
  const image=await rvPreparePublicPhoto(photo)
  const payload={name:p.name,redistribution_authorized:true,credit:credit.trim().slice(0,600),image}
  const json=new Blob([JSON.stringify(payload)],{type:'application/json'})
  const url=URL.createObjectURL(json)
  const a=document.createElement('a');a.href=url;a.download=file;a.click();setTimeout(()=>URL.revokeObjectURL(url),30000)
  const el=$('rv-fixed-publish-status')
  if(el){el.hidden=false;el.textContent='Fichier préparé : '+file+' ('+Math.ceil(json.size/1000)+' Ko). Ajoute-le dans le dossier GitHub ci-dessous, puis valide le commit.'}
 }catch(e){alert('Impossible de préparer le fichier public : '+(e.message||'erreur inconnue'))}
}
function fixedPhotoControls(p){
 const local=!!userFixedPhotos[p.name],published=!!rvPages.index.images[JSON.stringify(['hardware',p.name])]?.fixed
 return '<div class="fixed-controls"><label class="fixed-upload">'+(local||published?'Remplacer la photo fixe':'Choisir une photo fixe')+'<input type="file" accept="image/jpeg,image/png,image/webp" onchange="chooseFixedPhoto(event)"></label>'+(local?'<button onclick="removeFixedPhoto()">Revenir à la photo publiée</button><button class="primary" onclick="exportFixedPhoto()">Préparer la publication pour tous</button><a href="https://github.com/polamuss/retrovault/upload/main/tools/fixed-photos" target="_blank" rel="noopener">Ajouter le fichier sur GitHub</a><small id="rv-fixed-publish-status" hidden></small>':'')+'<small>'+(published?'Photo fixe publique disponible sur GitHub. ':'')+(local?'Aperçu local en attendant la publication. Seul un compte autorisé peut valider le commit.':'La photo choisie peut être publiée pour tous après validation GitHub.')+'</small></div>'
}

function rootMatches(index,q){const query=preparedQuery(q);if(rootResults&&rootResults.index===index&&rootResults.query===query.text)return rootResults;const rows=query.text?index.rows.filter(r=>groupMatches(r.p,r.g,query)):index.rows;return rootResults={index,query:query.text,rows,versions:rows.reduce((sum,r)=>sum+r.g.versions.length,0)}}
async function scanRootMatches(index,q,isCurrent){const query=preparedQuery(q);if(!query.text||index.rows.length<=10000||rootResults&&rootResults.index===index&&rootResults.query===query.text)return rootMatches(index,q);let rows=[],versions=0;for(let i=0;i<index.rows.length;i++){const r=index.rows[i];if(groupMatches(r.p,r.g,query)){rows.push(r);versions+=r.g.versions.length}if(i%3000===2999){await new Promise(resolve=>setTimeout(resolve,0));if(!isCurrent())return null}}return rootResults={index,query:query.text,rows,versions}}
function renderRootGames(){updateCatalogCounts();let el=$('root-game-list');if(!el)return;if(!rvPages.catalogReady&&rvPages.index.catalog_snapshot){const info=$('root-game-count');if(info)info.textContent=countFR(rvPages.index.report?.game_title_groups||0)+' jeux · ouverture du catalogue…';rvPagesLoadAll();return}const platforms=gamePlatforms().filter(p=>(!browseBrand||p.brand===browseBrand)&&(!rootGameSystem||p.system===rootGameSystem));const ticket=++rootRenderTicket;const current=()=>ticket===rootRenderTicket&&el.isConnected&&$('root-game-list')===el;const paint=async()=>{if(!current())return;const index=rootIndexFor(platforms);let result;if(index.rows.length>10000&&preparedQuery(browseQuery).text&&!(rootResults&&rootResults.index===index&&rootResults.query===preparedQuery(browseQuery).text)){$('root-game-count').textContent='Recherche dans le catalogue…';result=await scanRootMatches(index,browseQuery,current)}else result=rootMatches(index,browseQuery);if(!result||!current())return;const rows=result.rows,pages=Math.max(1,Math.ceil(rows.length/PAGE_SIZE));rootGamePage=Math.min(Math.max(0,rootGamePage),pages-1);rootGameVisible=rows.slice(rootGamePage*PAGE_SIZE,(rootGamePage+1)*PAGE_SIZE);$('root-game-count').textContent=countFR(rows.length)+' jeux · '+countFR(result.versions)+' versions · '+platforms.length+' plateformes';rvPagesPaintGrid(el,rootGameVisible.map(({p,g},i)=>groupCard(p,g,i,'openRootGame',true)).join('')||'<p>Aucun jeu référencé pour ces filtres. Sélectionne une plateforme et synchronise son catalogue.</p>');$('root-game-pagination').innerHTML=`<button onclick="moveRootGames(-1)" ${rootGamePage===0?'disabled':''}>Précédent</button><small style="text-align:center">Page ${rootGamePage+1}/${pages}</small><button onclick="moveRootGames(1)" ${rootGamePage+1>=pages?'disabled':''}>Suivant</button>`;let btn=$('root-sync');btn.disabled=!rootGameSystem||rootSyncRunning;btn.textContent=rootSyncRunning?'Synchronisation…':'Synchroniser';$('root-sync-note').textCon function syncPanel(){return `<div class="panel"><h3>Catalogue complet des jeux</h3><p class="muted">Télécharge les métadonnées de toutes les plateformes référencées, sans ROM ni téléchargement de toutes les images. Les éditions et régions sont conservées. Certaines sources peuvent rester indisponibles.</p><div class="row"><button id="sync-all" class="primary" onclick="syncAllGames()" ${allSyncRunning?'disabled':''}>Synchroniser toutes les plateformes</button><button id="sync-stop" onclick="allSyncCancel=true" ${allSyncRunning?'':'disabled'}>Arrêter</button></div><p id="sync-global-status" role="status">${esc(allSyncState||'Catalogue local partiel. Lance la synchronisation globale.')}</p><label>Importer un catalogue JSON hors ligne<input type="file" accept="application/json,.json" onchange="importCatalogFile(event)"></label></div>`}
function updateSyncPanel(){let e=$('sync-global-status');if(e)e.textContent=allSyncState;let a=$('sync-all'),b=$('sync-stop');if(a)a.disabled=allSyncRunning;if(b)b.disabled=!allSyncRunning}
function pathsFor(p,paths){return [...new Set(paths.filter(x=>x.endsWith('/'+p.system+'.dat')))];}
async function syncSystem(p,paths){if(syncJobs.has(p.system))return syncJobs.get(p.system);let task=(async()=>{let selected=pathsFor(p,paths),cached=await catalogStore('get','dat:'+p.system),merged=new Set([...getSystemGames(p),...(Array.isArray(cached)?cached.filter(goodName):[])]);let ok=0,failed=0;for(let path of selected){let entries=await readDAT(path);if(entries.length){ok++;for(let n of entries)merged.add(n)}else failed++}if(ok){let result=[...merged];browseCache.set(p.name,result);await catalogStore('put','dat:'+p.system,result);await catalogStore('put','sync:'+p.system,{ok,failed,at:Date.now()})}return {ok,failed,count:merged.size,available:selected.length}})();syncJobs.set(p.system,task);try{return await task}finally{syncJobs.delete(p.system)}}

async function syncAllGames(){if(allSyncRunning)return;allSyncRunning=true;allSyncCancel=false;allSyncState='Préparation des sources…';updateSyncPanel();let done=0,ok=0,partial=0,failed=0,total=0;try{let paths=await manifest();let ps=gamePlatforms().filter(p=>pathsFor(p,paths).length);total=ps.length;let idx=0;async function worker(){while(!allSyncCancel&&idx<ps.length){let p=ps[idx++],r;try{r=await syncSystem(p,paths)}catch{r={ok:0,failed:1}}done++;if(r.ok&&r.failed)partial++;else if(r.ok)ok++;else failed++;allSyncState=`${done}/${total} plateformes · ${ok} réussies · ${partial} partielles · ${failed} en échec · ${countFR(catalogCounts().jeu)} jeux regroupés`;updateSyncPanel();if(done%8===0)refreshGameSelect()}}await Promise.all([worker(),worker(),worker()]);allSyncState=(allSyncCancel?'Synchronisation arrêtée. ':'Synchronisation terminée. ')+allSyncState}catch{allSyncState='Synchronisation impossible. Les données existantes sont conservées.'}finally{allSyncRunning=false;updateSyncPanel();refreshGameSelect();if(tab==='Explorer'&&view==='list'&&!browsePlatform)renderRootGames()}}
async function syncRootGames(){let p=gamePlatforms().find(p=>p.system===rootGameSystem);if(!p||rootSyncRunning)return;rootSyncRunning=true;rootSyncNote='Lecture des catalogues de '+p.name+'…';renderRootGames();try{let r=await syncSystem(p,await manifest());rootSyncNote=r.ok?p.name+' : '+countFR(r.count)+' éditions · '+r.ok+' sources lues, '+r.failed+' en échec.':'Aucune source accessible pour '+p.name+'. Les données locales sont conservées.'}catch{rootSyncNote='Synchronisation indisponible. Les éditions locales sont conservées.'}finally{rootSyncRunning=false;refreshGameSelect();if(tab==='Explorer'&&view==='list'&&!browsePlatform)renderRootGames()}}
async function importCatalogFile(e){try{let f=e.target.files[0];if(!f)return;if(f.size>100*1024*1024)throw Error();let obj=JSON.parse(await f.text());if(!obj||typeof obj!=='object'||Array.isArray(obj)||Object.keys(obj).length>1000)throw Error();let entries=Object.entries(obj);for(let [k,v] of entries)if(!goodName(k)||!Array.isArray(v)||v.length>300000||v.some(n=>!goodName(n)))throw Error();registerPlatforms(entries.map(([k])=>'metadat/local/'+k+'.dat'));for(let [k,v] of entries){let p=gamePlatforms().find(p=>p.system===k);if(!p)continue;let result=[...new Set([...getSystemGames(p),...v])];browseCache.set(p.name,result);await catalogStore('put','dat:'+k,result)}allSyncState='Catalogue importé : '+countFR(catalogCounts().jeu)+' éditions locales.';if(tab==='Explorer')explorePage()}catch{alert('Catalogue JSON invalide ou trop volumineux. La collection personnelle reste intacte.')}finally{e.target.value=''}}
async function restoreRootCatalogs(){for(let p of gamePlatforms()){let a=await catalogStore('get','dat:'+p.system);if(Array.isArray(a)&&a.length){const previous=browseCache.get(p.name)||[],merged=[...new Set([...previous,...a.filter(goodName)])];if(merged.length!==previous.length||merged.some((n,i)=>n!==previous[i]))browseCache.set(p.name,merged);gameGroups(p);await new Promise(resolve=>setTimeout(resolve,0))}}if(tab==='Explorer'&&view==='list'&&!browsePlatform){let select=$('root-game-system');if(select){for(let opt of select.options){let p=gamePlatforms().find(x=>x.system===opt.value);if(p)opt.textContent=p.name+' ('+gameGroups(p).length+')'}}renderRootGames()}}

async function rvPagesSetLimit(n){rvPages.limit=Number(n)*1000000;try{localStorage.setItem('rv-pages-cache-limit',n);if(!rvPages.limit){rvPages.cacheGeneration++;await rvPages.eviction;await caches.delete(rvPages.cacheName);rvPages.cacheRows=null;rvPages.bytes=0}else{rvPages.eviction=rvPages.eviction.catch(()=>{}).then(async()=>rvPagesTrim(await caches.open(rvPages.cacheName)));await rvPages.eviction}}catch{}rvPagesCacheInfo()}
artReset=async function(){if(confirm('Vider seulement les images du catalogue ?')){rvPages.cacheGeneration++;await rvPages.eviction;await caches.delete(rvPages.cacheName);rvPages.cacheRows=null;rvPages.bytes=0;rvPages.missing.clear();rvPages.blocked.clear();rvPages.direct.clear();for(const r of rvPages.media.values())URL.revokeObjectURL(r.display);rvPages.media.clear();rvPages.preview.clear();rvPages.memoryBytes=0;rvPagesCacheInfo()}}
settings=function(){$('main').innerHTML=`<h2>Réglages</h2><div class="panel"><h3>Cache des images</h3><p>Les images référencées sont lues depuis le cache avant tout téléchargement. Les miniatures des jeux sont optimisées en AVIF (320 px maximum, qualité 52), ou en WebP si nécessaire. La compression est effectuée après affichage et seulement si le fichier devient plus léger. Le catalogue JSON est mis en cache séparément et n’est retéléchargé que lorsque son contenu change.</p><label>Limite du cache<select onchange="rvPagesSetLimit(this.value)">${[0,50,100,250,500].map(n=>`<option value="${n}" ${n*1000000===rvPages.limit?'selected':''}>${n} Mo</option>`).join('')}</select></label><label><input type="checkbox" onchange="rvPagesSetRemote(this.checked)" ${rvPages.remote?'checked':''}> Afficher les miniatures Libretro et LaunchBox (cache local prioritaire)</label><p><a href="data/report.json" target="_blank" rel="noopener">Statistiques du site et taille des fichiers</a></p><p><a href="credits.html" target="_blank" rel="noopener">Sources et licences des images hébergées</a></p><p id="rv-pages-usage">Mesure…</p><button onclick="artReset()">Vider le cache images</button></div><div class="panel"><h3>Collection privée</h3><p>Le JSON et les photos originales restent sur cet appareil. Aucun transfert automatique vers GitHub.</p><button class="primary" onclick="exportData()">Exporter la collection</button><hr><label>Importer une sauvegarde JSON<input type="file" accept="application/json,.json" onchange="importData(event)"></label><small>Remplacement après confirmation.</small><hr><label>Ajouter les fiches d’un JSON<input type="file" accept="application/json,.json" onchange="mergeData(event)"></label></div><p class="muted">RetroVault Pages 12.2 · recherche SteamGridDB élargie</p>`;rvPagesCacheInfo()}
// Preserve original compressed photo bytes: no lossy recoding or downscaling.
toPhoto=async function(f){if(f.size>20*1024*1024||!['image/jpeg','image/png','image/webp'].includes(f.type))throw Error('Format ou taille non accepté');let u=URL.createObjectURL(f);try{let im=new Image();im.src=u;await im.decode();if(im.width*im.height>40000000)throw Error('Image trop grande');return await new Promise((resolve,reject)=>{let r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=()=>reject(r.error);r.readAsDataURL(f)})}finally{URL.revokeObjectURL(u)}}
rotatedPhoto=async function(photo,degrees){let im=new Image();im.src=photo;await im.decode();let c=document.createElement('canvas');c.width=im.height;c.height=im.width;let ctx=c.getContext('2d');ctx.translate(c.width/2,c.height/2);ctx.rotate(degrees*Math.PI/180);ctx.drawImage(im,-im.width/2,-im.height/2);let out=c.toDataURL('image/png');if(out.length>28000000)throw Error('Image tournée trop volumineuse');return out}
